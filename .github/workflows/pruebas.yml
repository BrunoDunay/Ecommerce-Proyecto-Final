# Corre las pruebas de la API y revisa vulnerabilidades conocidas en cada push y pull request.
name: Pruebas y seguridad

on:
  push:
  pull_request:

jobs:
  api:
    name: Pruebas de la API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ecommerce-api/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high

  app:
    name: Dependencias del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
